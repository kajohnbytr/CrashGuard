[platformio]
default_envs = nodemcuv2
src_dir = .

[env:esp32-wroom-32]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dio
build_src_filter =
  -<*>
  +<SmartHelmetESP32WROOM/SmartHelmetESP32WROOM.ino>
lib_deps =
  adafruit/Adafruit MPU6050@2.2.9
  mikalhart/TinyGPSPlus@1.1.0

[env:esp32-c3-super-mini]
platform = espressif32@6.10.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dio
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1
build_src_filter =
  -<*>
  +<SmartHelmetESP32C3/SmartHelmetESP32C3.ino>
lib_deps =
  adafruit/Adafruit MPU6050@2.2.9
  mikalhart/TinyGPSPlus@1.1.0

[env:nodemcuv2]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
monitor_speed = 9600
build_src_filter =
  -<*>
  +<SmartHelmetESP8266/SmartHelmetESP8266.ino>
lib_deps =
  adafruit/Adafruit MPU6050@2.2.9
  mikalhart/TinyGPSPlus@1.1.0
  plerup/EspSoftwareSerial@8.2.0
